<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bolsinho: controle de gastos pessoais no navegador." />
    <title>Bolsinho · controle de gastos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topo">
      <h1>Bolsinho</h1>
      <p>Seu controle de gastos pessoal, simples e direto no navegador.</p>
    </header>

    <main class="conteudo">
      <section class="cartao resumo" aria-labelledby="resumo-titulo">
        <h2 id="resumo-titulo">Resumo</h2>
        <dl>
          <div><dt>Receitas</dt><dd id="total-receitas" data-testid="total-receitas">R$ 0,00</dd></div>
          <div><dt>Despesas</dt><dd id="total-despesas" data-testid="total-despesas">R$ 0,00</dd></div>
          <div><dt>Saldo</dt><dd id="saldo" data-testid="saldo">R$ 0,00</dd></div>
        </dl>
      </section>

      <section class="cartao" aria-labelledby="form-titulo">
        <h2 id="form-titulo">Nova transação</h2>
        <form id="form-transacao" novalidate>
          <div class="campo"><label for="descricao">Descrição</label><input id="descricao" name="description" autocomplete="off" /></div>
          <div class="campo"><label for="valor">Valor (R$)</label><input id="valor" name="amount" inputmode="decimal" placeholder="0,00" /></div>
          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="type">
              <option value="despesa">Despesa</option>
              <option value="receita">Receita</option>
            </select>
          </div>
          <div class="campo"><label for="categoria">Categoria</label><select id="categoria" name="category"></select></div>
          <div class="campo"><label for="data">Data</label><input id="data" name="date" type="date" /></div>
          <button type="submit">Adicionar</button>
        </form>
        <ul id="erros" class="erros" role="alert"></ul>
      </section>

      <section class="cartao" aria-labelledby="categorias-titulo">
        <h2 id="categorias-titulo">Despesas por categoria</h2>
        <ul id="por-categoria" aria-label="Despesas por categoria"></ul>
      </section>

      <section class="cartao lista" aria-labelledby="lista-titulo">
        <h2 id="lista-titulo">Transações</h2>
        <div class="filtros">
          <div class="campo">
            <label for="filtro-tipo">Filtrar por tipo</label>
            <select id="filtro-tipo">
              <option value="todos">Todos</option>
              <option value="receita">Receitas</option>
              <option value="despesa">Despesas</option>
            </select>
          </div>
          <div class="campo"><label for="filtro-categoria">Filtrar por categoria</label><select id="filtro-categoria"></select></div>
          <div class="campo"><label for="busca">Buscar</label><input id="busca" type="search" placeholder="Descrição..." /></div>
        </div>
        <p id="vazio" class="vazio">Nenhuma transação encontrada.</p>
        <ul id="lista-transacoes" aria-label="Lista de transações"></ul>
      </section>
    </main>

    <footer class="rodape">Trabalho prático · Engenharia de Software II</footer>
    <script type="module" src="main.js"></script>
  </body>
</html>
